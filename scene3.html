<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Part 3</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-start: #fff9f2;
  --bg-end: #f5ede3;
  --txt: #3f3a35;
  --mu: #9b928a;
  --hc: #9abdd6;
  --hd: #7ea3be;
  --nc: #e0b8cc;
  --nd: #c297b3;
  --bench: #d9cdbe;
  --bnd: #c6b8a8;
  --cake-frost: #fbe9d2;
  --cake-base: #e3c9b0;
  --candle: #f5e3c9;
  --flame: #ffb347;
  --flame-inner: #ffe066;
  --card-bg: rgba(255, 250, 242, 0.7);
  --shadow-soft: 0 12px 28px -12px rgba(60, 40, 20, 0.1);
  --border-glow: 0 0 0 1px rgba(255, 245, 235, 0.6) inset, 0 4px 12px rgba(0,0,0,0.02);
}

body {
  background: radial-gradient(circle at 20% 30%, var(--bg-start), var(--bg-end));
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', 'Georgia', system-ui, serif;
  margin: 0;
  padding: 16px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc1IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wMjUiIC8+PC9zdmc+');
  opacity: 0.25;
  z-index: 0;
}

#wrap {
  width: 100%;
  max-width: 460px;
  background: transparent;
  min-height: 640px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: Georgia, serif;
  border-radius: 52px;
  box-shadow: 0 24px 44px -16px rgba(40, 25, 10, 0.15), 0 0 0 1px rgba(210, 180, 150, 0.2);
  backdrop-filter: blur(2px);
  z-index: 2;
}

#stage {
  position: relative;
  width: 100%;
  min-height: 640px;
}

.sc {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 56px 20px 70px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s cubic-bezier(0.23, 1, 0.32, 1);
}

.sc.on {
  opacity: 1;
  pointer-events: all;
}

.sc-label {
  position: absolute;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  font: 10px/1 'Courier New', monospace;
  letter-spacing: 0.2em;
  color: var(--mu);
  background: rgba(255, 250, 240, 0.45);
  padding: 4px 18px;
  border-radius: 40px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(200,180,160,0.2);
  box-shadow: var(--shadow-soft);
  white-space: nowrap;
  text-transform: uppercase;
}

.visual {
  width: 100%;
  max-width: 360px;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: rgba(255, 250, 240, 0.15);
  backdrop-filter: blur(8px);
  border-radius: 48px;
  box-shadow: var(--border-glow), 0 8px 18px -6px rgba(60,40,20,0.06);
  margin: 8px 0 6px;
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.dia {
  max-width: 360px;
  width: 100%;
  padding: 20px 20px;
  background: var(--card-bg);
  backdrop-filter: blur(14px);
  border-radius: 40px;
  border: 1px solid rgba(240, 225, 210, 0.7);
  box-shadow: var(--shadow-soft), 0 2px 0 0 rgba(255,255,255,0.5) inset;
  margin-top: 8px;
  overflow: visible;
}

.ln {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.55s ease, transform 0.55s ease;
  margin-bottom: 10px;
  line-height: 1.75;
  color: var(--txt);
  word-break: break-word;
  overflow-wrap: anywhere;
  max-width: 100%;
}

.ln:last-child {
  margin-bottom: 0;
}

.ln.slow {
  transition: opacity 1s ease, transform 1s ease;
}

.ln.vis {
  opacity: 1;
  transform: translateY(0);
}

.narr {
  font: italic 14.5px/1.85 Georgia, serif;
  color: var(--mu);
  padding-left: 4px;
}

.big {
  font: 20px/1.7 Georgia, serif;
  color: var(--mu);
  text-align: center;
}

.sm {
  font-size: 13px;
  color: #a9988a;
}

.hb {
  font: italic 24px/1.6 Georgia, serif;
  color: #b4647c;
  text-align: center;
  text-shadow: 0 2px 6px rgba(180,100,120,0.1);
}

.mono {
  font: 11px/1 'Courier New', monospace;
  letter-spacing: 0.12em;
  color: var(--mu);
  text-align: center;
  text-transform: uppercase;
}

#dots {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 15;
  background: rgba(250, 245, 240, 0.3);
  padding: 6px 20px;
  border-radius: 40px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(200,180,160,0.2);
  box-shadow: var(--shadow-soft);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 6px;
  background: var(--mu);
  opacity: 0.25;
  transition: all 0.3s ease;
}

.dot.on {
  opacity: 0.9;
  width: 24px;
  background: #b89a88;
}

@keyframes floatBall {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.floatball {
  animation: floatBall 1.8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.9; }
}

.pulse {
  animation: pulse 2.2s ease-in-out infinite;
}

.flame {
  transform-origin: center bottom;
}

/* small screen adjustment */
@media (max-width: 400px) {
  .sc {
    padding: 46px 16px 60px;
  }
  .dia {
    padding: 16px 16px;
  }
  .narr {
    font-size: 13.5px;
  }
  .visual {
    height: 160px;
  }
}

#end-splash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 60% 40%, #fdf3ea, #ecdfd4);
  opacity: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
  transition: opacity 2.2s ease;
  border-radius: 52px;
}
#end-splash.on {
  opacity: 1;
  pointer-events: all;
}
#splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  opacity: 0;
  transform: scale(0.96);
  transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
}
#end-splash.on #splash-content {
  opacity: 1;
  transform: scale(1);
}
#home-btn {
  display: inline-block;
  font: 13px/1 'Courier New', monospace;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #5e4e44;
  background: rgba(255, 250, 240, 0.65);
  backdrop-filter: blur(8px);
  padding: 14px 36px;
  border-radius: 48px;
  border: 1px solid rgba(180, 150, 130, 0.3);
  box-shadow: 0 8px 18px -6px rgba(60, 40, 20, 0.1);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#home-btn:hover {
  background: rgba(255, 255, 250, 0.85);
  box-shadow: 0 12px 24px -8px rgba(60, 40, 20, 0.15);
  border-color: rgba(150, 120, 100, 0.4);
}
#home-btn:active {
  transform: scale(0.98);
}
#sound-splash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 40% 60%, #fdf3ea, #ecdfd4);
  opacity: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: opacity 2.2s ease;
  border-radius: 52px;
}
#sound-splash.on {
  opacity: 1;
  pointer-events: all;
}
#sound-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  opacity: 0;
  transform: scale(0.96);
  transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
}
#sound-splash.on #sound-content {
  opacity: 1;
  transform: scale(1);
}
.sound-item {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.sound-item.vis {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>
<body>
<h2 style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">A's birthday message for B · happy 17</h2>

<div id="wrap">
  <div id="dots"></div>
  <div id="stage"></div>
  <div id="end-splash">
    <div id="splash-content">
      <div style="font: italic 20px/1.7 Georgia, serif; color: #7a6a60; text-align:center; padding: 0 24px;">the end 🎈</div>
      <div style="font: italic 14px/1.7 Georgia, serif; color: #9b928a; text-align:center; padding: 0 24px;">hey forgot abt sound ? , continue tapping...</div>
    </div>
  </div>
  <div id="sound-splash">
    <div id="sound-content">
      <div class="sound-item" style="font: italic 18px/1.9 Georgia, serif; color: #7a6a60; text-align:center; padding: 0 24px;">can you hear it now ?</div>
      <div class="sound-item" style="font: italic 16px/1.9 Georgia, serif; color: #9b928a; text-align:center; padding: 0 24px;">its the sound of silence</div>
      <div class="sound-item" style="font: italic 16px/1.9 Georgia, serif; color: #b4647c; text-align:center; padding: 0 24px;">Its your day , enjoy it</div>
      <button id="home-btn" class="sound-item" onclick="window.location.href='https://pyruvate12.github.io/openme/'" ontouchend="this._tapped=true;window.location.href='https://pyruvate12.github.io/openme/';">↩ Back to Home</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const H = '#9abdd6', HD = '#7ea3be', N = '#e0b8cc', ND = '#c297b3';
  const MU = '#9b928a', BN = '#d9cdbe', BND = '#c6b8a8';

  function face(cx, cy, type) {
    const ey = cy - 3;
    let m;
    if (type === 'smile') m = `M${cx-6} ${cy+8} Q${cx} ${cy+14} ${cx+6} ${cy+8}`;
    else if (type === 'neutral') m = `M${cx-5} ${cy+8} Q${cx} ${cy+7} ${cx+5} ${cy+8}`;
    else m = `M${cx-5} ${cy+9} Q${cx} ${cy+6} ${cx+5} ${cy+9}`;
    return `<circle cx="${cx-5}" cy="${ey}" r="1.6" fill="rgba(255,255,255,0.65)"/>
<circle cx="${cx+5}" cy="${ey}" r="1.6" fill="rgba(255,255,255,0.65)"/>
<path d="${m}" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" fill="none"/>`;
  }

  function chr(x, y, col, dark, ft, sit) {
    const bh = sit ? 20 : 28;
    const ly = y + 18 + bh;
    let s = `<circle cx="${x}" cy="${y}" r="16" fill="${col}"/>
<rect x="${x-9}" y="${y+16}" width="18" height="${bh}" rx="4" fill="${col}"/>`;
    if (!sit) {
      s += `<rect x="${x-7}" y="${ly}" width="6" height="8" rx="2" fill="${dark}"/>
<rect x="${x+1}" y="${ly}" width="6" height="8" rx="2" fill="${dark}"/>`;
    }
    return s + face(x, y, ft);
  }

  function cakeSVG() {
    return `
      <g transform="translate(150, 120)">
        <ellipse cx="0" cy="28" rx="44" ry="8" fill="#d2bfae" />
        <rect x="-38" y="-4" width="76" height="32" rx="6" fill="var(--cake-base)" />
        <rect x="-38" y="-10" width="76" height="12" rx="4" fill="var(--cake-frost)" />
        <path d="M-30,-10 Q-28,0 -24,-10 M-10,-10 Q-8,-2 -4,-10 M10,-10 Q12,-2 16,-10 M26,-10 Q28,0 30,-10" stroke="#f0d5b5" stroke-width="2" fill="none"/>
        <rect x="-16" y="-26" width="6" height="16" rx="2" fill="var(--candle)" />
        <line x1="-13" y1="-26" x2="-13" y2="-10" stroke="#e0c0a0" stroke-width="1"/>
        <rect x="10" y="-26" width="6" height="16" rx="2" fill="var(--candle)" />
        <line x1="13" y1="-26" x2="13" y2="-10" stroke="#e0c0a0" stroke-width="1"/>
        <g class="flame">
          <ellipse cx="-13" cy="-32" rx="4" ry="7" fill="var(--flame)" />
          <ellipse cx="-13" cy="-33" rx="2.5" ry="5" fill="var(--flame-inner)" />
        </g>
        <g class="flame">
          <ellipse cx="13" cy="-32" rx="4" ry="7" fill="var(--flame)" />
          <ellipse cx="13" cy="-33" rx="2.5" ry="5" fill="var(--flame-inner)" />
        </g>
        <text x="0" y="18" text-anchor="middle" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#a77a5b" stroke="#fff" stroke-width="0.5" paint-order="stroke">17</text>
      </g>
    `;
  }

  const SCENES = [
    {
      lbl: '',
      svg: `<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        ${chr(108, 80, H, HD, 'smile', false)}
        ${chr(192, 80, N, ND, 'smile', false)}
        <circle cx="150" cy="50" r="18" fill="none" stroke="${BN}" stroke-width="0.7" stroke-dasharray="3 3" class="pulse"/>
        <line x1="30" y1="160" x2="270" y2="160" stroke="${BN}" stroke-width="0.8" opacity="0.5"/>
      </svg>`,
      lines: [
        { t: 'Then time went she became one with whom A didnt felt machine but also like a human', cls: 'narr', delay: 0 },
        { t: 'everytime she called him for badminton it was an exit from his research work', cls: 'narr', delay: 0 },
        { t: 'a time where he is free to say what he wants', cls: 'narr', delay: 0 },
        { t: 'and he dosent knows how can he repay this', cls: 'narr', delay: 0 },
        { t: 'but he learnt what it feels one when somebody does cares', cls: 'narr', delay: 0 },
        { t: 'It was a new anamoly in his system somehow', cls: 'narr sm', delay: 0 },
      ]
    },
    {
      lbl: '',
      svg: `<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        <rect x="100" y="40" width="100" height="68" rx="3" fill="none" stroke="${BN}" stroke-width="0.8"/>
        <rect x="108" y="50" width="84" height="48" rx="2" fill="none" stroke="${BN}" stroke-width="0.5" opacity="0.4"/>
        <line x1="114" y1="62" x2="186" y2="62" stroke="${BN}" stroke-width="0.6" opacity="0.5"/>
        <line x1="114" y1="70" x2="178" y2="70" stroke="${BN}" stroke-width="0.6" opacity="0.4"/>
        <line x1="114" y1="78" x2="174" y2="78" stroke="${BN}" stroke-width="0.6" opacity="0.3"/>
        <text x="150" y="126" text-anchor="middle" font-size="9" font-family="'Courier New',monospace" letter-spacing="0.1em" fill="${MU}">animation</text>
        <line x1="30" y1="160" x2="270" y2="160" stroke="${BN}" stroke-width="0.8" opacity="0.4"/>
      </svg>`,
      lines: [
        { t: "Today is that person's birthday", cls: 'narr', delay: 0 },
        { t: 'he dosent has much money but he can do this', cls: 'narr', delay: 0 },
        { t: 'animation', cls: 'mono', delay: 0 },
        { t: 'he hopes she liked it', cls: 'narr sm', delay: 0 },
      ]
    },
    {
      lbl: '',
      svg: `<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        <circle cx="150" cy="68" r="28" fill="none" stroke="${N}" stroke-width="0.7" opacity="0.4" class="floatball"/>
        <circle cx="150" cy="68" r="16" fill="${N}" opacity="0.18" class="floatball"/>
        <circle cx="150" cy="68" r="6" fill="${N}" opacity="0.5" class="floatball"/>
        <path d="M92 120 Q110 100 128 110 Q150 122 172 110 Q190 100 208 120" stroke="${BN}" stroke-width="0.8" fill="none"/>
      </svg>`,
      lines: [
        { t: 'he just wanna tell her', cls: 'narr', delay: 0, slow: true },
        { t: 'Happy birthday :D', cls: 'hb', delay: 2400, slow: true },
      ]
    },
    {
      lbl: '🎂 17 🎂',
      svg: `<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        ${cakeSVG()}
        <circle cx="80" cy="50" r="3" fill="${N}" opacity="0.5" class="floatball"/>
        <circle cx="220" cy="40" r="2.5" fill="${H}" opacity="0.5" class="floatball" style="animation-delay:0.4s"/>
        <circle cx="100" cy="30" r="2" fill="#f7c8b0" opacity="0.6" class="floatball" style="animation-delay:0.2s"/>
        <circle cx="200" cy="65" r="2.5" fill="#f7c8b0" opacity="0.5" class="floatball" style="animation-delay:0.7s"/>
        <path d="M60 80 Q80 60 100 80" stroke="${N}" fill="none" opacity="0.3" stroke-width="1.5"/>
        <path d="M200 70 Q220 50 240 70" stroke="${H}" fill="none" opacity="0.3" stroke-width="1.5"/>
        <text x="150" y="168" text-anchor="middle" font-size="9" font-family="'Courier New',monospace" letter-spacing="0.2em" fill="${MU}">make a wish</text>
      </svg>`,
      lines: [
        { t: '🎈 happy birthday 🎈', cls: 'hb', delay: 800, slow: true },
      ]
    },
    {
      lbl: '🏸',
      svg: `<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        ${chr(72, 84, H, HD, 'smile', false)}
        ${chr(228, 84, N, ND, 'smile', false)}
        <g transform="translate(63, 100) rotate(-40)">
          <rect x="-2" y="0" width="4" height="22" rx="2" fill="${HD}" opacity="0.78"/>
          <ellipse cx="0" cy="-11" rx="11" ry="7.5" fill="none" stroke="${H}" stroke-width="1.5" opacity="0.85"/>
        </g>
        <g transform="translate(237, 100) rotate(40)">
          <rect x="-2" y="0" width="4" height="22" rx="2" fill="${ND}" opacity="0.78"/>
          <ellipse cx="0" cy="-11" rx="11" ry="7.5" fill="none" stroke="${N}" stroke-width="1.5" opacity="0.85"/>
        </g>
        <path d="M91 94 Q150 28 209 94" stroke="${BN}" stroke-width="0.7" fill="none" stroke-dasharray="3 3" opacity="0.32"/>
        <ellipse cx="150" cy="50" rx="5" ry="3.5" fill="#f5e8d4" stroke="${BN}" stroke-width="0.8" opacity="0.85"/>
        <line x1="148" y1="46.5" x2="146" y2="40" stroke="${BN}" stroke-width="0.8" opacity="0.55"/>
        <line x1="150" y1="46.5" x2="150" y2="39" stroke="${BN}" stroke-width="0.8" opacity="0.55"/>
        <line x1="152" y1="46.5" x2="154" y2="40" stroke="${BN}" stroke-width="0.8" opacity="0.55"/>
        <line x1="30" y1="158" x2="270" y2="158" stroke="${BN}" stroke-width="0.8" opacity="0.5"/>
      </svg>`,
      lines: [
        { t: 'those badminton and talks', cls: 'narr', delay: 0 },
        { t: 'are some of best moments of my life in recent years.', cls: 'narr', delay: 0 },
      ]
    },
    {
      lbl: '',
      svg: `<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
        ${chr(112, 82, H, HD, 'smile', false)}
        ${chr(178, 78, N, ND, 'smile', false)}
        <line x1="50" y1="156" x2="260" y2="156" stroke="${BN}" stroke-width="0.8" opacity="0.45"/>
        <circle cx="72" cy="153" r="2.5" fill="${BN}" opacity="0.35"/>
        <circle cx="62" cy="149" r="1.8" fill="${BN}" opacity="0.22"/>
        <circle cx="82" cy="149" r="1.8" fill="${BN}" opacity="0.22"/>
        <path d="M122 62 Q137 52 150 60" stroke="${BN}" stroke-width="0.8" fill="none" opacity="0.35"/>
        <path d="M166 60 Q179 52 190 61" stroke="${N}" stroke-width="0.8" fill="none" opacity="0.35"/>
      </svg>`,
      lines: [
        { t: 'Thank you for all of them.', cls: 'hb', delay: 700, slow: true },
      ]
    },
  ];

  let cur = 0, li = -1, busy = false, pauseUntil = 0;
  const stage = document.getElementById('stage');
  const dotsWrap = document.getElementById('dots');
  let lineTimers = [];

  SCENES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot' + i;
    dotsWrap.appendChild(d);
  });

  SCENES.forEach((sc, i) => {
    const div = document.createElement('div');
    div.className = 'sc';
    div.id = 'sc' + i;
    let h = '';
    if (sc.lbl) h += `<div class="sc-label">${sc.lbl}</div>`;
    h += `<div class="visual">${sc.svg}</div>`;
    h += `<div class="dia" id="dia${i}"></div>`;
    div.innerHTML = h;
    stage.appendChild(div);
  });

  function clearTimers() {
    lineTimers.forEach(t => clearTimeout(t));
    lineTimers = [];
  }

  function showLine() {
    const sc = SCENES[cur];
    const n = li + 1;
    if (n >= sc.lines.length) return false;
    li = n;
    const line = sc.lines[li];
    const dia = document.getElementById('dia' + cur);

    const doShow = () => {
      const el = document.createElement('div');
      el.className = 'ln ' + (line.cls || '') + (line.slow ? ' slow' : '');
      el.innerHTML = line.t;
      dia.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('vis')));
    };

    if (line.delay && line.delay > 0) {
      const t = setTimeout(doShow, line.delay);
      lineTimers.push(t);
    } else {
      doShow();
    }
    return true;
  }

  function goScene(i) {
    clearTimers();
    document.querySelectorAll('.sc').forEach(s => s.classList.remove('on'));
    document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j <= i));
    document.getElementById('sc' + i).classList.add('on');
    li = -1;
    pauseUntil = Date.now() + 2000;
    const t = setTimeout(showLine, 600);
    lineTimers.push(t);
  }

  function advance() {
    if (busy) return;
    if (Date.now() < pauseUntil) return;
    if (showLine()) return;
    if (cur < SCENES.length - 1) {
      busy = true;
      clearTimers();
      document.getElementById('sc' + cur).classList.remove('on');
      setTimeout(() => {
        cur++;
        busy = false;
        goScene(cur);
      }, 950);
    } else {
      // last scene done — show end splash
      const endSplash = document.getElementById('end-splash');
      if (endSplash) endSplash.classList.add('on');
    }
  }

  let soundStep = 0;

  function advanceSound() {
    const items = document.querySelectorAll('#sound-content .sound-item');
    if (soundStep < items.length) {
      items[soundStep].classList.add('vis');
      soundStep++;
    }
  }

  function handleAdvance(e) {
    if (e.target.closest && e.target.closest('#home-btn')) return;
    if (e.target.closest && e.target.closest('#sound-splash')) {
      if (e.cancelable) e.preventDefault();
      advanceSound();
      return;
    }
    if (e.target.closest && e.target.closest('#end-splash')) {
      if (e.cancelable) e.preventDefault();
      const soundSplash = document.getElementById('sound-splash');
      if (soundSplash) soundSplash.classList.add('on');
      return;
    }
    if (e.cancelable) e.preventDefault();
    advance();
  }
  document.addEventListener('click', handleAdvance);
  document.addEventListener('touchend', handleAdvance, { passive: false });

  document.addEventListener('keydown', e => {
    if (['Enter', ' ', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
      advance();
    }
  });

  // Prevent home button from triggering advance()
  const homeBtn = document.getElementById('home-btn');
  if (homeBtn) {
    homeBtn.addEventListener('click', e => e.stopPropagation());
    homeBtn.addEventListener('touchend', e => { e.stopPropagation(); }, { passive: false });
  }

  goScene(0);
})();
</script>
</body>
</html>
