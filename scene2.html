<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Part 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-start: #fcf7f0;
  --bg-end: #f1e9df;
  --txt:#2f2a25;
  --mu:#8a837b;
  --hc:#9bb8d4;
  --hd:#7a9db8;
  --nc:#dcb8cc;
  --nd:#b88ba3;
  --bench:#d9cdbc;
  --card-bg: rgba(255, 250, 242, 0.65);
  --shadow-soft: 0 12px 28px -10px rgba(60, 40, 20, 0.08);
  --border-glow: 0 0 0 1px rgba(255, 245, 235, 0.7) inset, 0 4px 12px rgba(0,0,0,0.02);
}

body {
  background: radial-gradient(circle at 20% 30%, var(--bg-start), var(--bg-end));
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', 'Georgia', system-ui, serif;
  margin: 0;
  padding: 16px;
}

/* Subtle noise texture overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc1IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wMjUiIC8+PC9zdmc+');
  opacity: 0.3;
  z-index: 0;
}

#wrap{
  width:100%;
  max-width: 480px;
  background: transparent;
  min-height:580px;
  position:relative;
  overflow: hidden;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  font-family:Georgia,serif;
  border-radius: 48px;
  box-shadow: 0 20px 40px -12px rgba(40, 25, 10, 0.12), 0 0 0 1px rgba(210, 180, 150, 0.15);
  backdrop-filter: blur(2px);
  transition: box-shadow 0.3s;
  z-index: 2;
}

#stage{
  position:relative;
  width:100%;
  min-height:580px;
}

.sc{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 24px 60px;
  gap:4px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1);
}
.sc.on{opacity:1;pointer-events:all;}

.sc-label{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  font:10px/1 'Courier New',monospace;
  letter-spacing:0.2em;
  color:var(--mu);
  white-space:nowrap;
  background: rgba(250, 245, 235, 0.5);
  padding: 5px 16px;
  border-radius: 40px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(200, 180, 160, 0.2);
  box-shadow: var(--shadow-soft);
  text-transform: uppercase;
}

.visual{
  width:100%;
  max-width:360px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background: rgba(255, 250, 240, 0.2);
  backdrop-filter: blur(8px);
  border-radius: 42px;
  box-shadow: var(--border-glow), 0 8px 18px -6px rgba(60,40,20,0.06);
  margin: 8px 0 4px;
  transition: all 0.2s;
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.dia{
  max-width:360px;
  width:100%;
  min-height:140px;
  padding: 18px 22px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 36px;
  border: 1px solid rgba(240, 225, 210, 0.7);
  box-shadow: var(--shadow-soft), 0 2px 0 0 rgba(255,255,255,0.5) inset;
  margin-top: 6px;
}

.ln{
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.5s ease, transform 0.5s ease;
  margin-bottom:12px;
  line-height:1.8;
  color:var(--txt);
  font-weight: 400;
}
.ln.vis{opacity:1;transform:translateY(0);}

.sp{
  font:10px/1 'Courier New',monospace;
  letter-spacing:0.12em;
  margin-right:8px;
  text-transform: uppercase;
  background: rgba(200, 180, 160, 0.15);
  padding: 2px 8px;
  border-radius: 30px;
  display: inline-block;
}

.lh{font:16px/1.8 Georgia,serif;}
.lh .sp{color:var(--hc); background: rgba(155, 184, 212, 0.12);}

.ln_{font:16px/1.8 Georgia,serif;}
.ln_ .sp{color:var(--nc); background: rgba(220, 184, 204, 0.15);}

.narr{font:italic 15px/1.9 Georgia,serif;color:var(--mu); padding-left: 4px;}
.big{font:22px/1.7 Georgia,serif;color:var(--mu);text-align:center;font-weight:400;letter-spacing:-0.01em;}
.pause{text-align:center;font:18px/1 'Courier New',monospace;letter-spacing:0.5em;color:var(--mu);opacity:0.8;}
.sm{font-size:13px;color:#a29488;}

#dots{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;gap:8px;z-index:15;
  background: rgba(250, 245, 240, 0.35);
  padding: 6px 18px;
  border-radius: 40px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(200,180,160,0.2);
  box-shadow: var(--shadow-soft);
}
.dot{
  width:6px;height:6px;border-radius:6px;
  background:var(--mu);opacity:0.25;
  transition:all 0.3s ease;
  box-shadow:0 0 0 1px rgba(255,255,240,0.6);
}
.dot.on{opacity:0.9;width:22px;background:#a08e7e;}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  font:10px/1 'Courier New',monospace;
  letter-spacing:0.18em;
  color:var(--mu);
  background: rgba(255,250,242,0.5);
  padding: 8px 22px;
  border-radius: 40px;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(200,180,160,0.2);
  animation:breathe 3s ease-in-out infinite;
  z-index:15;
  transition:opacity 0.5s ease;
  white-space:nowrap;
  box-shadow: var(--shadow-soft);
  text-transform: uppercase;
}
@keyframes breathe{ 0%,100%{opacity:0.5;letter-spacing:0.18em;} 55%{opacity:0.9;letter-spacing:0.28em;} }

/* ----- END SPLASH OVERLAY (full screen) ----- */
#end-splash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 70% 30%, #f3ede5, #e7ddd0);
  backdrop-filter: blur(12px);
  opacity: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
  transition: opacity 2.2s ease;
  border-radius: 48px;
}
#end-splash.on {
  opacity: 1;
  pointer-events: all;
}
#splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 36px;
  opacity: 0;
  transform: scale(0.96);
  transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
}
#end-splash.on #splash-content {
  opacity: 1;
  transform: scale(1);
}
#splash-message {
  font-family: Georgia, serif;
  font-size: 28px;
  line-height: 1.6;
  color: #3f3832;
  text-align: center;
  padding: 24px 32px;
  background: rgba(255, 250, 240, 0.35);
  backdrop-filter: blur(4px);
  border-radius: 48px;
  border: 1px solid rgba(220, 200, 180, 0.3);
  box-shadow: 0 20px 30px -10px rgba(40, 20, 0, 0.08);
}
#play-part3-btn, #home-btn {
  display: inline-block;
  font: 13px/1 'Courier New', monospace;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #5e4e44;
  background: rgba(255, 250, 240, 0.65);
  backdrop-filter: blur(8px);
  padding: 14px 36px;
  border-radius: 48px;
  border: 1px solid rgba(180, 150, 130, 0.3);
  box-shadow: 0 8px 18px -6px rgba(60, 40, 20, 0.1);
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#home-btn {
  font-size: 11px;
  padding: 11px 28px;
  color: #7f7a73;
  background: rgba(245, 240, 232, 0.45);
  border-color: rgba(180, 160, 140, 0.2);
}
#play-part3-btn:hover, #home-btn:hover {
  background: rgba(255, 255, 250, 0.85);
  box-shadow: 0 12px 24px -8px rgba(60, 40, 20, 0.15);
  border-color: rgba(150, 120, 100, 0.4);
}
#play-part3-btn:active, #home-btn:active {
  transform: scale(0.98);
}

/* decorative floating element (vibe only) */
.vibe-float {
  position: absolute;
  bottom: 80px;
  right: 20px;
  font-size: 40px;
  opacity: 0.12;
  pointer-events: none;
  z-index: 5;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,0.05));
  animation: drift 14s infinite alternate ease-in-out;
}
@keyframes drift {
  0% { transform: translateY(0px) rotate(4deg); }
  100% { transform: translateY(-18px) rotate(12deg); }
}

/* SVG enhancements */
svg {
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.02));
}

/* responsive */
@media (max-width: 420px) {
  #wrap { border-radius: 32px; }
  .visual { height: 170px; }
  .dia { padding: 14px 18px; }
}
</style>

<h2 style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">A and B — a short story, click to progress</h2>

<div id="wrap">
  <!-- floating UI decoration (no script interaction) -->
  
  <div id="dots"></div>
  <div id="stage"></div>
  <div id="hint">tap · click · space</div>
  <div id="end-splash">
    <div id="splash-content">
      <div id="splash-message">we all are imperfect<br>that's what makes us human</div>
      <button id="play-part3-btn" onclick="window.location.href='scene3.html'" ontouchend="this._tapped=true;window.location.href='scene3.html';">▶ Play Part 3</button>
      <button id="home-btn" onclick="window.location.href='https://pyruvate12.github.io/openme/'" ontouchend="this._tapped=true;window.location.href='https://pyruvate12.github.io/openme/';">↩ Back to Home</button>
    </div>

<script>
// ========== SCRIPT UNTOUCHED (exactly as provided) ==========
const H='#7b9bb8', HD='#5e849e', N='#c89bb8', ND='#a87aa0';
const MU='#9a9088', BN='#c4b8a0', BND='#b8ac94', TX='#3a3530';

function face(cx,cy,type){
  const ey=cy-3;
  let m;
  if(type==='smile') m=`M${cx-6} ${cy+8} Q${cx} ${cy+14} ${cx+6} ${cy+8}`;
  else if(type==='neutral') m=`M${cx-5} ${cy+8} Q${cx} ${cy+7} ${cx+5} ${cy+8}`;
  else m=`M${cx-5} ${cy+9} Q${cx} ${cy+6} ${cx+5} ${cy+9}`;
  return `<circle cx="${cx-5}" cy="${ey}" r="1.6" fill="rgba(255,255,255,0.65)"/>
<circle cx="${cx+5}" cy="${ey}" r="1.6" fill="rgba(255,255,255,0.65)"/>
<path d="${m}" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" fill="none"/>`;
}

function chr(x,y,col,dark,ft,sit){
  const bh=sit?20:28;
  const ly=y+18+bh;
  let s=`<circle cx="${x}" cy="${y}" r="16" fill="${col}"/>
<rect x="${x-9}" y="${y+16}" width="18" height="${bh}" rx="4" fill="${col}"/>`;
  if(!sit){
    s+=`<rect x="${x-7}" y="${ly}" width="6" height="8" rx="2" fill="${dark}"/>
<rect x="${x+1}" y="${ly}" width="6" height="8" rx="2" fill="${dark}"/>`;
  }
  return s+face(x,y,ft);
}

function ghost(x,y,col){
  return `<g opacity="0.18"><circle cx="${x}" cy="${y}" r="12" fill="${col}"/>
<rect x="${x-7}" y="${y+12}" width="14" height="20" rx="3" fill="${col}"/>
<rect x="${x-5}" y="${y+30}" width="5" height="6" rx="2" fill="${col}"/>
<rect x="${x+1}" y="${y+30}" width="5" height="6" rx="2" fill="${col}"/></g>`;
}

const SCENES=[
  {
    lbl:'scene 7 · work',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="20" width="44" height="56" rx="2" fill="none" stroke="${BN}" stroke-width="1"/>
      <line x1="30" y1="44" x2="74" y2="44" stroke="${BN}" stroke-width="0.7"/>
      <line x1="52" y1="20" x2="52" y2="76" stroke="${BN}" stroke-width="0.7"/>
      <rect x="38" y="28" width="6" height="6" rx="1" fill="${MU}" opacity="0.3"/>
      <rect x="58" y="28" width="6" height="6" rx="1" fill="${MU}" opacity="0.3"/>
      <rect x="38" y="50" width="6" height="6" rx="1" fill="${MU}" opacity="0.3"/>
      <rect x="228" y="52" width="32" height="24" rx="2" fill="none" stroke="${BN}" stroke-width="0.8"/>
      <line x1="234" y1="59" x2="254" y2="59" stroke="${BN}" stroke-width="0.6" opacity="0.5"/>
      <line x1="234" y1="64" x2="254" y2="64" stroke="${BN}" stroke-width="0.6" opacity="0.5"/>
      <rect x="62" y="138" width="176" height="8" rx="3" fill="${BN}"/>
      <rect x="68" y="146" width="6" height="20" rx="2" fill="${BND}"/>
      <rect x="224" y="146" width="6" height="20" rx="2" fill="${BND}"/>
      ${chr(150,98,H,HD,'neutral',true)}
    </svg>`,
    lines:[
      {t:'A still remembered everything',cls:'narr'},
      {t:'but got pulled into work',cls:'narr'},
      {t:'research',cls:'narr'},
      {t:'time just kept going',cls:'narr sm'},
    ]
  },
  {
    lbl:'scene 8 · class 11',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="20" width="264" height="80" rx="3" fill="none" stroke="${BN}" stroke-width="0.8" stroke-dasharray="4 3"/>
      <text x="22" y="34" font-size="9" font-family="'Courier New',monospace" letter-spacing="0.12em" fill="${MU}">class 11</text>
      ${ghost(60,70,MU)}${ghost(84,66,MU)}${ghost(36,68,MU)}
      ${ghost(200,70,MU)}${ghost(224,66,MU)}${ghost(248,68,MU)}
      ${chr(150,68,H,HD,'sad',false)}
      <rect x="62" y="148" width="176" height="8" rx="3" fill="${BN}"/>
      <rect x="68" y="156" width="6" height="18" rx="2" fill="${BND}"/>
      <rect x="224" y="156" width="6" height="18" rx="2" fill="${BND}"/>
    </svg>`,
    lines:[
      {t:'too much at once',cls:'narr'},
      {t:"couldn't handle it",cls:'narr'},
      {t:'peers mocked. some teachers too.',cls:'narr'},
      {t:'A couldn\'t process it',cls:'narr'},
      {t:'maybe... i am different',cls:'narr'},
      {t:'just probability',cls:'narr sm'},
    ]
  },
  {
    lbl:'scene 9 · auto ride',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 148 Q150 80 270 118" stroke="${BN}" stroke-width="1" fill="none" stroke-dasharray="5 4"/>
      <path d="M80 148 Q150 112 220 148" stroke="${BN}" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
      <circle cx="80" cy="148" r="6" fill="${BND}"/>
      <circle cx="220" cy="148" r="6" fill="${BND}"/>
      ${chr(120,110,H,HD,'smile',true)}
      ${chr(178,110,N,ND,'smile',true)}
    </svg>`,
    lines:[
      {t:'then... remebered B again',cls:'narr'},
      {t:'that auto ride',cls:'narr'},
      {t:'felt free',cls:'narr'},
    ]
  },
  {
    lbl:'scene 10 · lowest point',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <circle cx="150" cy="80" r="52" fill="none" stroke="${BN}" stroke-width="0.8" stroke-dasharray="3 3"/>
      ${chr(118,82,H,HD,'neutral',false)}
      ${chr(182,82,N,ND,'neutral',false)}
      <line x1="134" y1="100" x2="166" y2="100" stroke="${BN}" stroke-width="0.8"/>
    </svg>`,
    lines:[
      {t:'A told everything',cls:'narr'},
      {t:'at lowest point',cls:'narr sm'},
    ]
  },
  {
    lbl:'scene 11 · listened',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">

      <circle cx="196" cy="80" r="38" fill="none" stroke="${N}" stroke-width="0.6" opacity="0.4"/>
      <path d="M134 80 Q150 68 166 80" stroke="${BN}" stroke-width="1" fill="none"/>
      ${chr(104,80,H,HD,'smile',false)}
      ${chr(196,80,N,ND,'smile',false)}
    </svg>`,
    lines:[
      {t:"B didn't ignore",cls:'narr'},
      {t:'she listened',cls:'narr'},
      {t:'she acknowledged everything',cls:'narr'},
    ]
  },
  {
    lbl:'scene 12 · mistakes',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <rect x="90" y="40" width="120" height="80" rx="4" fill="none" stroke="${BN}" stroke-width="0.8"/>
      <rect x="102" y="52" width="96" height="56" rx="3" fill="none" stroke="${BN}" stroke-width="0.5" opacity="0.5"/>
      <circle cx="118" cy="80" r="4" fill="${BN}" opacity="0.5"/>
      <circle cx="150" cy="72" r="4" fill="${BN}" opacity="0.5"/>
      <circle cx="182" cy="84" r="4" fill="${BN}" opacity="0.5"/>
    </svg>`,
    lines:[
      {t:'some mistakes did happened in betweem',cls:'narr'},
      {t:'unknowingly',cls:'narr'},
      {t:'A saw them as normal',cls:'narr sm'},
    ]
  },
  {
    lbl:'scene 13 · gathered',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="148" x2="260" y2="148" stroke="${BN}" stroke-width="0.8" opacity="0.5"/>
      ${ghost(80,100,MU)}${ghost(56,96,MU)}
      ${chr(150,100,H,HD,'neutral',false)}
      <path d="M166 108 L195 95" stroke="${BN}" stroke-width="0.8" stroke-dasharray="3 2" fill="none"/>
      <circle cx="198" cy="93" r="4" fill="${BN}" opacity="0.6"/>
    </svg>`,
    lines:[
      {t:"disappearing didn't feel right",cls:'narr'},
      {t:'as a friend',cls:'narr sm'},
      {t:'A gathered himself',cls:'narr'},
      {t:'said what was wrong',cls:'narr'},
    ]
  },
  {
    lbl:'scene 14 · accepted',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      ${chr(118,90,H,HD,'smile',false)}
      ${chr(182,90,N,ND,'smile',false)}
      <path d="M136 82 Q150 70 164 82" stroke="${N}" stroke-width="1" fill="none" opacity="0.5"/>
    </svg>`,
    lines:[
      {t:"B didn't get defensive",cls:'narr'},
      {t:'she accepted it',cls:'narr'},
    ]
  },
  {
    lbl:'',
    svg:`<svg width="300" height="170" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
      <!-- empty, the splash will take over -->
    </svg>`,
    lines:[],   // no dialogue lines – splash handled separately
    splash: true,
    splashHtml: `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:20px;">
        <div style="font: 24px/1.5 Georgia, serif; color: var(--txt); margin-bottom: 16px;">we all are imperfect</div>
        <div style="font: 24px/1.5 Georgia, serif; color: var(--txt); margin-bottom: 32px;">that's what makes us human</div>
        <div style="font: 13px/1 'Courier New', monospace; letter-spacing:0.2em; color: var(--mu);"></div>
      </div>
    `

];

let cur=0, li=-1, busy=false;
const stage=document.getElementById('stage');
const hint=document.getElementById('hint');
const dotsWrap=document.getElementById('dots');

SCENES.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='dot';d.id='dot'+i;
  dotsWrap.appendChild(d);
});

SCENES.forEach((sc,i)=>{
  const div=document.createElement('div');
  div.className='sc';div.id='sc'+i;
  let h='';
  if(sc.lbl) h+=`<div class="sc-label">${sc.lbl}</div>`;
  h+=`<div class="visual">${sc.svg}</div>`;
  h+=`<div class="dia" id="dia${i}"></div>`;
  div.innerHTML=h;
  stage.appendChild(div);
});

function showLine(){
  const sc=SCENES[cur];
  const n=li+1;
  if(n>=sc.lines.length) return false;
  li=n;
  const line=sc.lines[li];
  const dia=document.getElementById('dia'+cur);
  const el=document.createElement('div');
  el.className='ln '+(line.cls||'');
  if(line.center) el.style.textAlign='center';
  let inner='';
  if(line.sp) inner+=`<span class="sp">${line.sp}</span>`;
  inner+=line.t;
  el.innerHTML=inner;
  dia.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('vis')));
  return true;
}

function goScene(i){
  document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j<=i));
  document.getElementById('sc'+i).classList.add('on');
  li=-1;
  const currentScene = SCENES[i];
  if (currentScene.splash) {
    // splash scene: inject splashHtml directly, then end
    const dia = document.getElementById('dia'+i);
    dia.innerHTML = currentScene.splashHtml;
    // hide hint and stop further clicks after a short delay
    setTimeout(() => {
      hint.style.opacity = '0';
    }, 300);
  } else {
    setTimeout(showLine,550);
  }
}

function advance(){
  if(busy) return;
  if(showLine()) return;
  if(cur<SCENES.length-1){
    busy=true;
    document.getElementById('sc'+cur).classList.remove('on');
    setTimeout(()=>{cur++;busy=false;goScene(cur);},950);
  } else {
    hint.style.opacity = '0';
    const endSplash = document.getElementById('end-splash');
    if (endSplash) {
      endSplash.classList.add('on');
    }
  }
}

document.getElementById('wrap').addEventListener('click',advance);
document.getElementById('wrap').addEventListener('touchend',e=>{e.preventDefault();advance();},{passive:false});
document.addEventListener('keydown',e=>{
  if(['Enter',' ','ArrowRight'].includes(e.key)){e.preventDefault();advance();}
});

// Prevent nav buttons from triggering advance()
['play-part3-btn','home-btn'].forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('click',e=>e.stopPropagation());
  el.addEventListener('touchend',e=>{e.stopPropagation();},{passive:false});
});

goScene(0);
</script>
</body>
</html>
