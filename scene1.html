<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Part 1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-start: #fdf8f0;
  --bg-end: #f2ebe1;
  --text: #2e2a26;
  --muted: #7f7a73;
  --h: #8ba9c4;
  --hd: #6a8ca8;
  --n: #d9b0c0;
  --nd: #b58ea3;
  --bench: #d4c9b8;
  --win: #e7ddce;
  --glow: rgba(255, 245, 235, 0.7);
  --card-bg: rgba(255, 250, 240, 0.7);
  --shadow-sm: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
  --border-light: 1px solid rgba(180, 160, 140, 0.2);
}

html, body {
  width:100%; height:100vh;
  background: radial-gradient(circle at 30% 20%, var(--bg-start), var(--bg-end));
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  font-family: 'Segoe UI', 'Georgia', system-ui, sans-serif;
}

/* subtle noise overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc1IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wMjUiIC8+PC9zdmc+');
  opacity: 0.35;
  z-index: 0;
}

#stage {
  position:relative;
  width:100%; height:100%;
  z-index: 2;
}

.scene {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.95s cubic-bezier(0.23, 1, 0.32, 1);
  padding:0 20px;
  gap:8px;
  backdrop-filter: blur(1px);
}
.scene.active { opacity:1; pointer-events:all; }

.scene-label {
  position:absolute;
  top:40px;
  font: 10px/1 'Courier New', monospace;
  letter-spacing:0.22em;
  color: var(--muted);
  text-transform: uppercase;
  background: rgba(250, 245, 235, 0.5);
  padding: 4px 14px;
  border-radius: 30px;
  backdrop-filter: blur(4px);
  border: var(--border-light);
  box-shadow: var(--shadow-sm);
}

.visual {
  width:100%;
  max-width:380px;
  height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background: rgba(255, 250, 240, 0.2);
  border-radius: 44px;
  backdrop-filter: blur(6px);
  box-shadow: 0 15px 30px -10px rgba(60, 40, 20, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
  margin-top: 10px;
  transition: box-shadow 0.4s;
}

.dia {
  max-width:360px;
  width:100%;
  min-height:160px;
  padding: 16px 20px;
  margin-top: 6px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 32px;
  border: var(--border-light);
  box-shadow: var(--shadow-sm), 0 2px 0 0 rgba(255,255,255,0.6) inset;
}

.ln {
  opacity:0;
  transform:translateY(8px);
  transition:opacity 0.55s ease, transform 0.5s ease;
  margin-bottom:14px;
  line-height:1.8;
  color: var(--text);
  font-weight: 400;
}
.ln.vis { opacity:1; transform:translateY(0); }

.ln .sp {
  font: 10px/1 'Courier New', monospace;
  letter-spacing:0.15em;
  margin-right:8px;
  text-transform: uppercase;
  background: rgba(200, 180, 160, 0.15);
  padding: 2px 6px;
  border-radius: 20px;
  display: inline-block;
}

.lh { font: 16px/1.8 Georgia, 'Times New Roman', serif; }
.lh .sp { color: var(--h); background: rgba(139, 169, 196, 0.12); }

.ln_ { font: 16px/1.8 Georgia, serif; }
.ln_ .sp { color: var(--n); background: rgba(217, 176, 192, 0.15); }

.narr { 
  font: italic 15px/1.9 Georgia, serif; 
  color: var(--muted); 
  letter-spacing: 0.01em;
  padding-left: 4px;
}

.big { 
  font: 22px/1.7 Georgia, serif; 
  color: var(--muted); 
  text-align:center; 
  font-weight: 400;
  text-shadow: 0 2px 4px rgba(0,0,0,0.02);
}

.pause { 
  text-align:center; 
  font: 20px/1 'Courier New', monospace; 
  letter-spacing:0.5em; 
  color: var(--muted); 
  opacity: 0.8;
}

.sm { font-size:13px; color:#9e9185; }

#dots {
  position:fixed; top:22px; left:50%;
  transform:translateX(-50%);
  display:flex; gap:8px; z-index:20;
  background: rgba(250, 245, 240, 0.3);
  padding: 6px 16px;
  border-radius: 40px;
  backdrop-filter: blur(8px);
  border: var(--border-light);
  box-shadow: var(--shadow-sm);
}
.dot {
  width:6px; height:6px; border-radius:6px;
  background: var(--muted); 
  opacity:0.25;
  transition: all 0.3s ease;
  box-shadow: 0 0 0 1px rgba(255,255,240,0.5);
}
.dot.on { 
  opacity:0.9; 
  width:22px; 
  background: #b09b8a;
  box-shadow: 0 0 6px rgba(180, 140, 110, 0.3);
}

#hint {
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%);
  font: 11px/1 'Courier New', monospace;
  letter-spacing:0.2em;
  color: var(--muted);
  background: rgba(255, 250, 240, 0.4);
  padding: 8px 22px;
  border-radius: 40px;
  backdrop-filter: blur(4px);
  border: var(--border-light);
  animation: breathe 3.2s ease-in-out infinite;
  z-index:20;
  transition:opacity 0.5s ease;
  box-shadow: var(--shadow-sm);
  text-transform: uppercase;
}

@keyframes breathe { 
  0%,100%{ opacity:0.5; letter-spacing:0.2em; } 
  55%{ opacity:0.9; letter-spacing:0.28em; } 
}

@keyframes glitch {
  0%,100%  { transform:translate(0,0); opacity:1; }
  15%      { transform:translate(3px,0) skewX(3deg); opacity:0.65; }
  30%      { transform:translate(-2px,1px); opacity:1; }
  50%      { transform:translate(2px,-1px) skewX(-2deg); opacity:0.75; }
  70%      { transform:translate(-3px,0); opacity:1; }
  85%      { transform:translate(1px,1px); opacity:0.85; }
}
.glitch { animation:glitch 0.38s steps(1,end) 2 !important; }

#end {
  position:fixed; inset:0;
  background: radial-gradient(circle at 70% 30%, #efe6dc, #e2d6ca);
  opacity:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 30px;
  pointer-events:none;
  transition:opacity 2.2s ease;
  z-index:30;
  backdrop-filter: blur(6px);
}
#end.on { 
  opacity:1; 
  pointer-events:all;
}
#endtext {
  font: 13px/1 'Courier New', monospace;
  letter-spacing:0.28em;
  color: #6b5f55;
  opacity:0;
  transition:opacity 1.2s ease 1.2s;
  background: rgba(255,245,235,0.5);
  padding: 14px 32px;
  border-radius: 48px;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(200,180,160,0.25);
  box-shadow: 0 20px 30px -10px rgba(60,40,20,0.1);
}
#end.on #endtext { opacity:1; }

#play-part2-btn {
  display: inline-block;
  font: 13px/1 'Courier New', monospace;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #5e4e44;
  background: rgba(255, 250, 240, 0.65);
  backdrop-filter: blur(8px);
  padding: 14px 36px;
  border-radius: 48px;
  border: 1px solid rgba(180, 150, 130, 0.3);
  box-shadow: 0 8px 18px -6px rgba(60, 40, 20, 0.1);
  text-decoration: none;
  opacity: 0;
  transition: opacity 1.2s ease 1.8s, transform 0.2s ease, box-shadow 0.2s ease;
  transform: translateY(4px);
  cursor: pointer;
}
#end.on #play-part2-btn {
  opacity: 1;
  transform: translateY(0);
}
#play-part2-btn:hover {
  background: rgba(255, 255, 250, 0.85);
  box-shadow: 0 12px 24px -8px rgba(60, 40, 20, 0.15);
  border-color: rgba(150, 120, 100, 0.4);
}
#play-part2-btn:active {
  transform: scale(0.98);
}

/* floating vadapav motif – UI improvement only, no script change */
.vadapav-ghost {
  position: fixed;
  bottom: 90px;
  right: 20px;
  font-size: 34px;
  opacity: 0.2;
  pointer-events: none;
  z-index: 5;
  transform: rotate(8deg);
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
  animation: floatVada 12s infinite alternate ease-in-out;
}
@keyframes floatVada {
  0% { transform: translateY(0px) rotate(6deg); }
  100% { transform: translateY(-15px) rotate(12deg); }
}

/* enhance SVG rendering */
svg {
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.02));
  transition: filter 0.2s;
}

/* responsive touch */
@media (max-height: 600px) {
  .visual { height:170px; max-width:320px; }
  .dia { min-height:130px; padding: 12px 16px; }
  .scene-label { top: 24px; }
}
</style>
</head>
<body>

<!-- UI decoration – just for vibe, doesn't affect script -->

<div id="dots"></div>
<div id="stage"></div>
<div id="hint"></div>
<div id="end">
  <div id="endtext">vadapav still remaining lol !</div>
  <a href="scene2.html" id="play-part2-btn">▶ Play Part 2</a>
</div>

<script>
// ========== SCRIPT UNTOUCHED (exactly as provided) ==========
const M = '#3a3530';
const BG = '#f6f1e9';

function face(cx, cy, type) {
  const ey = cy - 3;
  let mouth;
  if (type === 'smile')
    mouth = `M${cx-6} ${cy+8} Q${cx} ${cy+15} ${cx+6} ${cy+8}`;
  else if (type === 'neutral')
    mouth = `M${cx-5} ${cy+8} Q${cx} ${cy+7} ${cx+5} ${cy+8}`;
  else
    mouth = `M${cx-5} ${cy+9} Q${cx} ${cy+7} ${cx+5} ${cy+9}`;
  return `<circle cx="${cx-5}" cy="${ey}" r="1.8" fill="#fff" opacity="0.72"/>
<circle cx="${cx+5}" cy="${ey}" r="1.8" fill="#fff" opacity="0.72"/>
<path d="${mouth}" stroke="#fff" stroke-width="1.35" fill="none" opacity="0.65"/>`;
}

function char(x, y, col, dark, faceType, opts={}) {
  const sitting = opts.sitting;
  const bodyH = sitting ? 22 : 30;
  const legY = y + 18 + bodyH;
  let s = `<circle cx="${x}" cy="${y}" r="18" fill="${col}"/>
<rect x="${x-10}" y="${y+18}" width="20" height="${bodyH}" rx="5" fill="${col}"/>`;
  if (!sitting) {
    s += `<rect x="${x-8}" y="${legY}" width="7" height="9" rx="2" fill="${dark}"/>
<rect x="${x+1}" y="${legY}" width="7" height="9" rx="2" fill="${dark}"/>`;
  }
  s += face(x, y, faceType);
  return s;
}

function ghost(x, y, col) {
  return `<g opacity="0.22">
<circle cx="${x}" cy="${y}" r="14" fill="${col}"/>
<rect x="${x-8}" y="${y+14}" width="16" height="24" rx="4" fill="${col}"/>
<rect x="${x-6}" y="${y+36}" width="6" height="7" rx="2" fill="${col}"/>
<rect x="${x+0}" y="${y+36}" width="6" height="7" rx="2" fill="${col}"/>
</g>`;
}

const GH = '#a09488', GHD = '#8a807a';

const SCENES = [
  {
    label: 'class 2',
    svg: () => `<svg width="300" height="195" viewBox="0 0 300 195" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="16" width="36" height="48" rx="2" fill="none" stroke="#d4c8b2" stroke-width="1.2"/>
      <line x1="14" y1="40" x2="50" y2="40" stroke="#d4c8b2" stroke-width="0.8"/>
      <line x1="32" y1="16" x2="32" y2="64" stroke="#d4c8b2" stroke-width="0.8"/>
      <rect x="250" y="38" width="30" height="36" rx="3" fill="none" stroke="#d4c8b2" stroke-width="1"/>
      <rect x="58" y="145" width="184" height="9" rx="3" fill="#c4b8a0"/>
      <rect x="65" y="154" width="7" height="26" rx="2" fill="#b8ac94"/>
      <rect x="228" y="154" width="7" height="26" rx="2" fill="#b8ac94"/>
      ${char(108, 92, 'var(--h)', 'var(--hd)', 'neutral', {sitting:true})}
      ${char(192, 92, 'var(--n)', 'var(--nd)', 'neutral', {sitting:true})}
    </svg>`,
    lines: [
      { sp:'A', t:'hi, i am A', cls:'lh' },
      { sp:'B', t:"hi, i'm B", cls:'ln_' },
      { sp:'A', t:'you like art?', cls:'lh' },
      { sp:'B', t:'yes', cls:'ln_' },
      { sp:'A', t:'ohk', cls:'lh' },
    ]
  },
  {
    label: '',
    svg: () => `<svg width="130" height="130" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="65" cy="65" r="56" fill="none" stroke="#d4c8b2" stroke-width="1.5"/>
      <circle cx="65" cy="65" r="3.5" fill="#9a9088"/>
      <line x1="65" y1="11" x2="65" y2="22" stroke="#d4c8b2" stroke-width="1.5"/>
      <line x1="119" y1="65" x2="108" y2="65" stroke="#d4c8b2" stroke-width="1.5"/>
      <line x1="65" y1="119" x2="65" y2="108" stroke="#d4c8b2" stroke-width="1.5"/>
      <line x1="11" y1="65" x2="22" y2="65" stroke="#d4c8b2" stroke-width="1.5"/>
      <line x1="65" y1="65" x2="65" y2="36" stroke="#9a9088" stroke-width="2.8" stroke-linecap="round">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 65 65" to="360 65 65" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="65" y1="65" x2="65" y2="18" stroke="${M}" stroke-width="1.8" stroke-linecap="round">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 65 65" to="360 65 65" dur="0.55s" repeatCount="indefinite"/>
      </line>
    </svg>`,
    lines: [
      { t:'6 years later...', cls:'big' },
    ]
  },
  {
    label: 'school',
    svg: () => `<svg width="340" height="195" viewBox="0 0 340 195" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="182" x2="320" y2="182" stroke="#d4c8b2" stroke-width="1" opacity="0.5"/>
      ${ghost(46, 110, GH)}
      ${ghost(70, 106, GH)}
      ${ghost(26, 108, GHD)}
      ${ghost(266, 110, GH)}
      ${ghost(290, 106, GH)}
      ${ghost(310, 108, GHD)}
      ${char(170, 120, 'var(--h)', 'var(--hd)', 'neutral')}
    </svg>`,
    lines: [
      { t:'getting left out became normal', cls:'narr' },
      { t:"but forcing in didn't feel right", cls:'narr' },
      { sp:'A', t:'nah... not taking safe paths just to fit in', cls:'lh sm' },
    ]
  },
  {
    label: 'physics lab',
    svg: () => `<svg width="320" height="195" viewBox="0 0 320 195" xmlns="http://www.w3.org/2000/svg">
      <rect x="60" y="150" width="200" height="9" rx="3" fill="#c4b8a0"/>
      <rect x="66" y="159" width="7" height="24" rx="2" fill="#b8ac94"/>
      <rect x="247" y="159" width="7" height="24" rx="2" fill="#b8ac94"/>
      <path d="M212 130 L206 150 L228 150 L222 130Z" fill="#9bb8c4" opacity="0.6"/>
      <rect x="213" y="122" width="10" height="8" rx="2" fill="#9bb8c4" opacity="0.6"/>
      <rect x="177" y="134" width="14" height="14" rx="2" fill="#b8c49b" opacity="0.55"/>
      <circle cx="244" cy="142" r="6" fill="#c4b89b" opacity="0.55"/>
      <circle cx="262" cy="144" r="4" fill="#c4a89b" opacity="0.4"/>
      ${char(120, 92, 'var(--h)', 'var(--hd)', 'neutral')}
      <line x1="130" y1="116" x2="158" y2="146" stroke="var(--h)" stroke-width="5" stroke-linecap="round"/>
      <line x1="130" y1="116" x2="158" y2="146" stroke="var(--hd)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </svg>`,
    lines: [
      { t:'days in the lab', cls:'narr' },
      { t:'winning... but it stopped feeling like winning', cls:'narr' },
      { t:'just curiosity', cls:'narr' },
    ]
  },
  {
    label: 'class 9 · stayback',
    svg: () => `<svg id="s4" width="320" height="195" viewBox="0 0 320 195" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="16" width="32" height="42" rx="2" fill="none" stroke="#d4c8b2" stroke-width="1"/>
      <line x1="14" y1="37" x2="46" y2="37" stroke="#d4c8b2" stroke-width="0.7"/>
      <line x1="30" y1="16" x2="30" y2="58" stroke="#d4c8b2" stroke-width="0.7"/>
      <line x1="20" y1="182" x2="300" y2="182" stroke="#d4c8b2" stroke-width="1" opacity="0.4"/>
      <rect x="250" y="140" width="42" height="30" rx="3" fill="none" stroke="#d4c8b2" stroke-width="0.8" opacity="0.5"/>
      <line x1="256" y1="148" x2="286" y2="148" stroke="#d4c8b2" stroke-width="0.6" opacity="0.4"/>
      <line x1="256" y1="154" x2="286" y2="154" stroke="#d4c8b2" stroke-width="0.6" opacity="0.4"/>
      ${char(118, 120, 'var(--h)', 'var(--hd)', 'neutral')}
      ${char(198, 120, 'var(--n)', 'var(--nd)', 'smile')}
    </svg>`,
    lines: [
      { sp:'B', t:'may i drop you home?', cls:'ln_' },
      { t:'...', cls:'pause', glitch:true },
      { sp:'A', t:'yeah... ok', cls:'lh' },
    ]
  },
  {
    label: 'next day',
    svg: () => `<svg width="320" height="195" viewBox="0 0 320 195" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="182" x2="300" y2="182" stroke="#d4c8b2" stroke-width="1" opacity="0.4"/>
      ${char(118, 120, 'var(--h)', 'var(--hd)', 'smile')}
      ${char(202, 120, 'var(--n)', 'var(--nd)', 'smile')}
    </svg>`,
    lines: [
      { sp:'A', t:"i'll repay", cls:'lh' },
      { sp:'B', t:'pay me in vadapav', cls:'ln_' },     
    ]
  },
];

let cur = 0, lineIdx = -1, busy = false;
const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
const endEl = document.getElementById('end');
const dotsWrap = document.getElementById('dots');

SCENES.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot'; d.id = 'dot' + i;
  dotsWrap.appendChild(d);
});

SCENES.forEach((sc, i) => {
  const div = document.createElement('div');
  div.className = 'scene'; div.id = 'sc' + i;
  let h = '';
  if (sc.label) h += `<div class="scene-label">${sc.label}</div>`;
  h += `<div class="visual">${sc.svg()}</div>`;
  h += `<div class="dia" id="dia${i}"></div>`;
  div.innerHTML = h;
  stage.appendChild(div);
});

function showLine() {
  const sc = SCENES[cur];
  const next = lineIdx + 1;
  if (next >= sc.lines.length) return false;
  lineIdx = next;
  const line = sc.lines[lineIdx];
  const dia = document.getElementById('dia' + cur);
  const el = document.createElement('div');
  el.className = 'ln ' + (line.cls || '');
  let inner = '';
  if (line.sp) inner += `<span class="sp">${line.sp}</span>`;
  inner += line.t;
  el.innerHTML = inner;
  dia.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('vis')));
  if (line.glitch) {
    setTimeout(() => {
      const svg = document.getElementById('s4');
      if (svg) {
        svg.classList.add('glitch');
        setTimeout(() => svg.classList.remove('glitch'), 800);
      }
    }, 120);
  }
  return true;
}

function goScene(i) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j <= i));
  document.getElementById('sc' + i).classList.add('active');
  lineIdx = -1;
  setTimeout(showLine, 600);
}

function advance() {
  if (busy) return;
  if (showLine()) return;
  if (cur < SCENES.length - 1) {
    busy = true;
    document.getElementById('sc' + cur).classList.remove('active');
    setTimeout(() => { cur++; busy = false; goScene(cur); }, 1000);
  } else {
    busy = true;
    hint.style.opacity = '0';
    setTimeout(() => endEl.classList.add('on'), 650);
  }
}

document.addEventListener('click', advance);
document.addEventListener('touchend', e => { e.preventDefault(); advance(); }, { passive:false });
document.addEventListener('keydown', e => {
  if (['Enter', ' ', 'ArrowRight'].includes(e.key)) { e.preventDefault(); advance(); }
});

goScene(0);
</script>
</body>
</html>
